name: PetCare CI

on:
  push:
    branches: [main, RamoDoProf, "petcare/**"]
  pull_request:
    branches: [main, RamoDoProf]

permissions:
  contents: read

jobs:
  test:
    name: Node \${{ matrix.node }} / \${{ matrix.storage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            storage: json
          - node: 24
            storage: sqlite
    defaults:
      run:
        working-directory: petcare
    env:
      PETCARE_STORAGE: \${{ matrix.storage }}
      PETCARE_DATA_DIR: \${{ runner.temp }}/petcare-data
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node }}
      - name: Formatar e verificar o código
        run: |
          npx --yes prettier@3 --write server.js auth.js db.js storage routes public test.js
          npx --yes prettier@3 --check server.js auth.js db.js storage routes public test.js
      - name: Executar testes
        run: npm test
